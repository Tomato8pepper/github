    <!-- 
        浏览器的缓存机制（强缓存、协商缓存） 
        浏览器的缓存机制，也称为HTTP缓存机制，是根据请求报文和
        响应报文的缓存标识来进行的。这种机制确保了每个请求的缓存 存入与读取，从而减少了网络请求、服务
        器的负载，并加快了页面的加载时间。浏览器缓存的关键在于，浏览器每次发起请求时， 都会先在浏览器
        缓存中查找该请求的结果以及缓存标识。如果存在该缓存结果和缓存标识，并且该结果没有过期，那么浏览
        器会 直接使用本地缓存来获取资源，而无需重新下载。浏览器的缓存过程可以分为强制缓存和协商缓存两
        种情况：

        强制缓存：当浏览器向服务器发送请求时，服务器会将缓存规则放入HTTP响应报文的HTTP头中和请求结果
        一起返回给浏览器。 控制强制缓存的字段分别是Expires和Cache-Control。Expires是HTTP/1.0中使
        用的字段，其值为服务器返回该请求 结果缓存的到期时间。Cache-Control是HTTP/1.1中使用的字段，
        其值可以是max-age=xxx，表示缓存内容将在xxx秒后 失效。 
        
        协商缓存：当强制缓存失效后，浏览器携带
        缓存标识向服务器发起请求，由服务器根据缓存标识决定是否使用缓存的过程。 如果资源无更新，服务器
        返回304状态码，表示资源未更新，再次向浏览器缓存获取缓存结果；如果资源更新了，服务器返回200状
        态码和新的资源。 此外，浏览器的缓存机制还包括了Push Cache（也称为推送缓存或启发式缓存），它是
        HTTP/2新增的内容。当其他类型的缓存 都没有命中时，Push Cache才会被使用。它的时效性很短，只在
        session会话中存在，会话结束时就被释放。 用户行为也会影响浏览器缓存的控制。例如，地址栏访问或
        链接跳转是正常用户行为，会触发浏览器缓存机制；而F5刷新会设置 max-age=0，跳过强缓存判断，进行
        协商缓存判断；ctrl+F5刷新则会跳过强缓存和协商缓存，直接从服务器拉取资源。
     -->
</body>
