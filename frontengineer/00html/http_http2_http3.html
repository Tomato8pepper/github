    <!-- 
        http的缺陷
        1. 队头阻塞: 指当顺序发送的请求序列中的某个请求堵塞时，后面的请求一样被堵塞，导致客户端无法获取
                    数据
        2. 无状态特性：纯净的http请求没有cookie机制，每一个连接都是新的，不安全性：传输内容没有加密，
                    中途可能被劫持或者被篡改不支持服务端推送
        
        http1.1 SPDY协议：网络分层架构： HTTP => SPDY => SSL => TCP 特性： 
        1. 多路复用：SPDY允许在一个连接上无限制并发流 
        2. 头部压缩：使用HPACK算法，每次请求、响应只发送差异头部 
        3. 请求优先级：在网络通道被非关键资源堵塞时，高优先级的请求会被优先处理 
        4. 服务端推送：服务端主动把资源推送给客户端，客户端有权利选择是否接收 
        5. 提高安全性：支持使用https进行加密传输

        http2（基于SPDY，专注于性能） 新增特性： 
        1. 二进制分帧 - http2性能增强的核心：在应用层使用二进制分帧方式传输，引入了新单位（帧，消息，
            流），服务器单位时间 接收到的请求变多，可以提高并发数 
        2. 多路复用：一个域名对应一个连接，一个流代表了一个完整的请求-响应过程。帧是最小的数据单位，
            每个帧会标识出该帧属于 哪个流，流也就是多个帧组成的数据流。多路复用，就是在一个 TCP 连接
            中可以存在多个流

        缺陷： 
            1. TCP 以及 TCP+TLS 建立连接的延时 
            2. TCP 的队头阻塞并没有彻底解决：HTTP2 出现丢包时，整个 TCP 都要等待重传，那么就会
                阻塞该 TCP 连接中的所有请求。 
            3. 多路复用导致服务器压力上升 
            4. 多路复用容易 Timeout

        http3(基于UDP的QUIC协议)
        主要特点 1. 改进的拥塞控制、可靠传输 2. 快速握手 3. 集成了 TLS 1.3 加密 
            4. 多路复用 5. 连接迁移
     -->
