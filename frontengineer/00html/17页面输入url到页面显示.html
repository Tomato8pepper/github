<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        1. 用户输入
               浏览器进程  接收用户的输入  检查输入内容与请求协议  组成新的url  通过IPC（进程通信
           机制）将完整url转发给网络进程

        2. url请求
            2.1. 缓存     有缓存返回资源给浏览器进程  无缓存发起网络请求
            2.2. DNS解析  获取url对应的ip地址 
            2.3. 连接     利用IP地址和服务器建立TCP连接，如果是https请求还需要建立TLS连接
            2.4. 发送请求  向服务器发送HTTP请求，请求包括请求行（GET 或POST），请求头（User-Agent、
                          Accept、Cookie 等信息），请求正文等内容
            2.5. 服务端处理请求生成响应数据（包括响应行、响应头、响应体）并发给网络进程
            2.6. 重定向   如果返回响应行中的状态码是301/302，需要重定向到其他url，
                 这时 网络进程会从响应头中读取Location重定向的地址，然后发起新的http/https请求
            2.7. 状态码200  检查content-type，如果是字节流类型，会将该请求提交到下载管理器，
                 是html，则通知浏览器进程 准备渲染进程

        3. 准备渲染进程 如果旧页面中打开的属于同一站点复用原来的进程，如果不同，则开启新的单独的渲染
           进程

        4. 渲染 
            4.1. 渲染进程准备好后，浏览器进程向渲染进程发起“提交文档”的消息，渲染进程接收到消息和网络
                 进程建立传输数据的 “管道” 
            4.2. 渲染进程接收完数据后，向浏览器发送“确认提交” ，浏览器进程接收到确认消息后更新浏览器
                 界面状态：安全、 地址栏url、前进后退的历史状态等。 
            4.3. 渲染进程对文档进行页面解析和资源加载： 构建DOM树：渲染进程将html转换为dom树结构 
                 样式计算生成styleSheets 根据dom树和styleSheets生成布局树（不包括隐藏的DOM元素，
                 如display：none的元素、和head元素） 对布局树进行分层，并生成分层树（layerTree） 
                 渲染引擎将每个图层的绘制拆分成很多小的绘制指令，然后将指令按照顺序组成一个待绘制列表，
                 并提交到渲染进程中 的合成线程,合成线程将图层划分为图块（tile），然后将图块转换为位图
                 （栅格化），通常栅格化过程都会使用 GPU 来加速生成。 所有的图块都被栅格化后，合成线程
                 会生成一个绘制图块的命令“ DrawQuad”，将该命令提交给浏览器进程 浏览器进程接收到合成线
                 程发过来的命令，根据命令将页面内容绘制到内存中，再将内存显示在屏幕上
     -->
     
</body>
</html>
