<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .bg{
        height: 200px;
        background-color: orange;
    }
</style>
<body>
    <div class="box"></div>
    <button class="btn_add">添加</button>
    <button class="btn_delete">删除</button>
    <button class="btn_toggle">切换</button>
    <button class="btn_contains">包含</button>

    <script>
        var box_obj = document.querySelector('.box')
        var btn_add = document.querySelector('.btn_add')
        var btn_delete = document.querySelector('.btn_delete')
        var btn_toggle = document.querySelector('.btn_toggle')
        var btn_contains = document.querySelector('.btn_contains')

        btn_add.onclick = function() {
            box_obj.classList.add('bg')
        }
        btn_delete.onclick = function() {
            box_obj.classList.remove('bg')
        }
        btn_toggle.onclick = function() {
            box_obj.classList.toggle('bg')
        }
        btn_contains.onclick = function() {
            console.log(box_obj.classList.contains('bg'))
        }
    </script>
</body>
</html>
