            String(字符串): 表示文本数据，可通过单引号、双引号或反引号创建, 具有不可变性。
                    常用方法包括slice()、replace()、trim()等。‌‌
            Number(数字): 包含整数、浮点数及特殊值(Infinity、-Infinity、NaN),底层以64位浮点数存储。
                    ES2020新增BigInt解决大整数精度问题。
            Boolean(布尔值): 仅true和false两个值,常用于条件判断。
            Null: 表示空值,typeof null返回"object"（历史遗留问题）。‌‌
            Undefined‌: 变量声明未赋值时的默认值,与null严格不相等。
            Symbol(ES6新增): 唯一且不可变的值，常用作对象属性的键。
            BigInt(ES2020新增): 表示任意精度整数,后缀为n(如123n)。
        */
