<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .one{
            width: 200px;
            height: 200px;
            border: 1px solid red;
            word-break: break-all;
        }
        .one:first-line{
            color: red;
        }

        .one:first-letter{
            font-size: 50px;
            color: red;
        }

        /* :after 伪类   ::after 伪元素 */
    </style>
</head>
<body>
    <div class="one">
        abcdefghijklmnopqrstuvwxyz
        abcdefghijklmnopqrstuvwxyz
        abcdefghijklmnopqrstuvwxyz
    </div>
</body>
</html>
