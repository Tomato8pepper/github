<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li{
            color: red;
        }
        li:first-child{
            color: red;
        }
        li:last-child{
            color: red;
        }
        /* 倒数第n个 */
        li:nth-last-child(3){
            color: red;
        }
        /* 正数第n个 */
        li:nth-child(3){
            color: red;
        }
    </style>
</head>
<body>
    <ul>
        <span>first-child</span>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
        <li>8</li>
        <li>9</li>
        <li>0</li>
        <span>last-child</span>
    </ul>
</body>
</html>
