<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .line {
            height: 100px;
            /* 实现线性渐变 */
            background-image: linear-gradient(
                /* to right, */
                /* 0deg,  从下往上 */
                135deg, /* 从左往右 */
                red 20%,
                green 20%,
                green 40%,
                red 40%,
                red 60%,
                green 60%,
                green 80%,
                red 80%,
                red 100%
            );

            background-size: 200px 300px;
        }
    </style>
</head>
<body>
    <div class="line"></div>
</body>
</html>
