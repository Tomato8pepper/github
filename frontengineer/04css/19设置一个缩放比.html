<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 577px;
            height: 100px;
            background-color: pink;
            display: flex;
        }

        .box>div{
            background-color: yellowgreen;
        }
        div.one{
            flex: 1;
            background-color: blue;
        }
        div.two{
            flex: 1;
            background-color: green;
        }
        div.three{
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="one"></div>
        <div class="two"></div>
        <div class="three"></div>
    </div>
</body>
</html>
