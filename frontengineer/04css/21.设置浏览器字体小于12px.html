<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        transform: scale(0.8, 0.8);
    }
</style>
<body>
    <!-- 
        1. 更改浏览器基础设定，设置 -》 外观  -》 自定义字体  -》 选择最小字体
        2. transform.scale() 
    -->
    <div class="box">
        <span>更改浏览器基础设定，设置 -》 外观  -》 自定义字体  -》 选择最小字体</span>
    </div>
</body>
</html>
