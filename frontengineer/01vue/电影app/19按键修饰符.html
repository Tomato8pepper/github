<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="lib/vue.js"></script>
</head>
<body>
    <div id="box">
        <input type="text" @keyup="handleKeyup" />
        <input type="text" @keyup.enter.ctrl="handleKeyup1" />
        <input type="text" @keyup.65="handleKeyup2" />
    </div>
    <!-- .esc .up .down .left .right .space .ctrl .shift .delete -->
    <script>
        new Vue({
            el: '#box',
            data() {
                return {}
            },
            methods: {
                handleKeyup(e) {
                    if(e.keyCode===13) {
                        console.log('enter键')
                    }
                },
                handleKeyup1() {
                    console.log('ctrl')
                },
                // 输入a键触发
                handleKeyup2() {
                    console.log('a')
                }
            }
        })
    </script>
</body>
</html>
