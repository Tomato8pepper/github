<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="lib/vue.js"></script>
</head>
<body>
    <!-- 可以防止从输入框中输入的恶意链接 -->
    <!-- 防止XSS、CSRF  1前端过滤，2后台转义(<> &It &gt), 3给cookie加上属性http -->
    <div id="box">
        {{mytext}}  <!-- "<b>加粗的</b>" -->
        <div v-html="mytext"></div>
    </div>
    <script>
        new Vue({
            el: '#box',
            data: {
                mytext: "<b>加粗的</b>"
            }
        })
    </script>
</body>
</html>
