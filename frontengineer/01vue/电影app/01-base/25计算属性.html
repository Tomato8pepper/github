<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="lib/vue.js"></script>
</head>
<style>
     
</style>
<body>
    <div id="box">
           {{ myname.substring(0, 1).toUpperCase() + myname.substring(1) }}

           {{ myMethodName() }}

           <!-- 防止模板过重难以维护，将逻辑放在计算属性中 -->
           <!-- 计算属性具有依赖缓存，当相关的状态改变时会重新计算，而方法每次都需要执行 -->
           {{ myComputedName }}
    </div>
     
    <script>
       var vm = new Vue({
             el: '#box',
             data: {
                myname: 'kerwin'
             },
             methods: {
                myMethodName() {
                    return this.myname.substring(0, 1).toUpperCase() + this.myname.substring(1)
                
                }
             },
             computed: {
                myComputedName() {
                    // 必须要有返回值
                    return this.myname.substring(0, 1).toUpperCase() + this.myname.substring(1)
                }
             }
        })

        // vue架构模式   mvvm（双向数据绑定）
    </script>
</body>
</html>
