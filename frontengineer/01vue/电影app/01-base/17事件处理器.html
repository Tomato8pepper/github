<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="lib/vue.js"></script>
</head>
<body>
    <div id="box">
        {{count}}

        <!-- $event固定的 -->
        <button @click="handleClick1($event, 1, 2)">add-1-函数表达式</button>
        <button @click="handleClick2">add-2-函数名</button>

        <input type="text" @input="handleInput" />
    </div>
    <script>
        new Vue({
            el: '#box',
            data() {
                return {
                    count: 0
                }
            },
            methods: {
                handleClick1(event, a, b) {
                    console.log(event, a, b)
                    this.count++
                },
                handleClick2(evt) {
                    this.count++
                },
                handleInput(evt) {
                    // target事件对象
                    console.log(evt.target.value)
                }
            }
        })
    </script>
</body>
</html>
