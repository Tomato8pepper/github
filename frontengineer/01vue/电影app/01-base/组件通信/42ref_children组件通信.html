<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../lib/axios.min.js"></script>
    <script src="../lib/vue.js"></script>

</head>
<style>
    
</style>
<body>
     
    <div id="box">
       <input type="text"  ref="mytext"/>
       <div ref="mydiv"></div>
       <button @click="handleClick">add</button>
       <kerwin ref="kerwin">
        
       </kerwin>
       <child></child>
    </div>
    <script>
        Vue.component('kerwin', {
            template: `
            <div>{{myname}}</div>
            `,
            data() {
                return {
                    myname: 'child-111111'
                }
            },
            
        })

        Vue.component('child', {
            template: `
            <div>{{myname}}</div>
            `,
            data() {
                return {
                    myname: 'child'
                }
            },
            
        })
 
        new Vue({
            el: '#box',
            data() {
                return {
                    
                }
            },
            methods: {
                handleClick() {
                    console.log(this.$refs)
                    this.$children[1].myname = 'changeName'
                    console.log(this.$children[0].myname)
                    this.$refs.kerwin.myname = 'child-222222'
                }
            }
        })
         

        // ref 绑定dom节点，拿到的就是dom对象
        // ref 绑定组件 拿到的就是组件对象
    </script>
</body>
</html>
