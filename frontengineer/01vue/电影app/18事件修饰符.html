<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="lib/vue.js"></script>
</head>
<body>
    <div id="box">
        <!-- 点自己触发 -->
         <ul @click.self="handleUlClick">
            <!-- 阻止冒泡 -->
            <li @click.stop="handleLiClick">111</li>
            <li>222</li>
            <!-- 点击一次就不会触发了 -->
            <li @click.once="handleLiClick">333</li>
         </ul>

         <!-- 加上修饰符不会跳转 -->
         <a href="" @click.prevent>跳转</a>
    </div>
    <script>
        new Vue({
            el: '#box',
            data() {
                return {
                     
                }
            },
            methods: {
                handleUlClick() {
                    console.log('ul')
                },
                handleLiClick() {
                    console.log('li')
                }
            }
        })
    </script>
</body>
</html>
