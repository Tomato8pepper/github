<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="lib/vue.js"></script>
</head>
<style>
     
</style>
<body>
    <!-- xhr是标准、fetch -->
    <div id="box">
        <button @click="handleFetch">ajax-fetch</button>
    </div>
    <script>
        new Vue({
            el: '#box',
            data() {
                return {
                     
                }
            },
            methods: {
                handleFetch() {
                    fetch('./json/test.json', {
                        method: "post",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name: 'kerwin'
                        })
                    })
                    .then(res => res.json())
                    .then(res => {
                        console.log(res)
                    })
                    .catch(err => {
                        console.log(err)
                    })
                }
            }
        })

        
    </script>
</body>
</html>
