<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="lib/vue.js"></script>
</head>
<body>
    <div id="box">
        <div v-if="isCreated">111111</div>
        <div v-else>222222</div>

        <!-- template是一个包装元素，不会创建在页面上 -->
        <!-- <template v-if="isCreated">
            <div>1111</div>
            <div>2222</div>
            <div>3333</div>
        </template> -->
 

        <ul>
            <li v-for="item in datalist">
                {{item.title}}
                <span v-if="item.state===0">未付款</span>
                <span v-else-if="item.state===1">代发货</span>
                <span v-else-if="item.state===2">已发货</span>
                <span v-else>已完成</span>
            </li>
        </ul>
    </div>
    <script>
        new Vue({
            el: '#box',
            data() {
                return {
                    isCreated: false,
                    datalist: [
                        {
                            title: '11',
                            state: 0
                        },
                        {
                            title: '22',
                            state: 1
                        },
                        {
                            title: '33',
                            state: 2
                        },
                        {
                            title: '44',
                            state: 3
                        },
                    ]
                }
            }
        })
    </script>
</body>
</html>
