<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="lib/vue.js"></script>
</head>
<style>
    .aa{
        color: aqua;
    }
    .bb{
        color: blue;
    }
    .cc{
        color: chartreuse;
    }
</style>
<body>
    <div id="box">
        <div :class="classObj">动态切换class-1-对象</div>
        <div :class="classArr">动态切换class-1-数组</div>

        <div :style="styleObj">动态切换style-1-对象</div>
        <div :style="styleArr">动态切换style-1-数组</div>
    </div>
    <script>
        var vm = new Vue({
            el: '#box',
            data: {
                classObj: {
                    aa: false,
                    bb: true,
                    cc: true
                },
                classArr: ['aa', 'bb', 'cc'],
                styleObj: {
                    color: 'red',
                    fontSize: '20px'
                },
                styleArr: [{backgroundColor: 'yellow'}, {fontSize: '20px'}]
            }
        })


        // vue2 解决方案， Vue.set(对象， 属性， 值)
        // vm.set('classObj', 'dd', true)

        // vue3 支持动态增加属性拦截
    </script>
</body>
</html>
