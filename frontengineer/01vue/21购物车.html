<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="lib/vue.js"></script>
</head>
<style>
    li{
        display: flex;
        justify-content: space-around;
        padding: 10px;
    }
</style>
<body>
    <div id="box">
         <ul>
            <input type="checkbox" v-model="isAll" @change="handleAllChecked"/>全选/全不选
            <li v-for="(item, index) in datalist" :key="item.id" @change="handleItemChecked">
                <input type="checkbox" v-model="checkList" :value="item"/>
                <img style="width: 80px;height: 80px" :src="item.pic" />
                <div>
                    <div>{{item.name}}</div>
                    <div style="color: red">￥{{item.price}}</div>
                </div>

                <div>
                    <button @click="item.number--" :disabled="item.number===1">-</button>
                    <span>{{item.number}}</span>
                    <button @click="item.number++" :disabled="item.number===item.limit">+</button>
                </div>

                <div>
                    <button @click="handleDelete(index, item.id)">删除</button>
                </div>
            </li>
         </ul>
         <div>总金额: {{ sum }}</div>

         {{ checkList }}
    </div>
     
    <script>
       var vm = new Vue({
            el: '#box',
            data() {
                return {
                     datalist: [{
                        name: '商品1',
                        price: 10,
                        number: 1,
                        id: 1,
                        limit: 5,
                        pic: 'https://img2.baidu.com/it/u=2653525504,919074456&fm=253&fmt=auto&app=120&f=PNG?w=500&h=889'
                     },
                    {
                        name: '商品2',
                        price: 20,
                        number: 2,
                        id: 2,
                        limit: 8,
                        pic: 'https://img2.baidu.com/it/u=2357964753,2625543845&fm=253&fmt=auto&app=120&f=JPEG?w=800&h=1200'
                    },
                    {
                        name: '商品3',
                        price: 30,
                        number: 3,
                        id: 3,
                        limit: 10,
                        pic: 'https://img2.baidu.com/it/u=2976416442,3475923227&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=889'
                    }],
                    checkList: [],
                    isAll: false
                }
            },
            methods: {
                handleDelete(index, id) {
                    this.datalist.splice(index, 1)

                    this.checkList = this.checkList.filter(item => item.id!==id)
                    
                    this.handleItemChecked()
                    
                },
                
                handleAllChecked() {
                    if(this.isAll) {
                        this.checkList = this.datalist
                    }else {
                        this.checkList = []
                    }
                },
                handleItemChecked() {
                    if(this.checkList.length === this.datalist.length) {
                        this.isAll = true
                    }else {
                        this.isAll =false
                    }
                }
            },
            computed: {
                sum() {
                    var total = 0
                    this.checkList.forEach(item => {
                        total += item.price*item.number
                    })
                    return total
                },
            }
        })

        // vue架构模式   mvvm（双向数据绑定）
    </script>
</body>
</html>
