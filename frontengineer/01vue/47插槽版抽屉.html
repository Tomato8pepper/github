<body>
    <div id="box">
          
         <navbar>
            <button @click="isShow = !isShow">click</button>
         </navbar>
         <sidebar v-show="isShow"></sidebar>
    </div>
    <script>
 
        Vue.component('navbar', {
            template: `
                <div>
                     navbar -- <slot></slot>
                </div>
            ` 
        })

        
        Vue.component('sidebar', {
            template: `
                <div style="background-color: yellow; width: 200px; height: 500px">
                    <ul>
                        <li>首页</li>
                        <li>钱包</li>
                        <li>设置</li>
                    </ul>
                </div>
            ` 
        })
 
        new Vue({
            el: '#box',
            data() {
                return {
                     isShow: false 
                }
            } 
        })
    </script>
