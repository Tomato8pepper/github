<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="lib/vue.js"></script>
</head>
<body>
    <div id="box">
         {{mytext}}
         <textarea v-model="mytext"></textarea>
        <br>
            <div>
                用户名：<input type="text" v-model="mytext" />
            </div>
        <div>
            {{'isRemember:   ' + isRemember   }}</br>
            <input type="checkbox" v-model="isRemember"/> 记住用户名
            <button @click="handleLogin">登录</button>
        </div>
        
        <div>
            <h2>注册页面-兴趣爱好</h2>
            {{ 'checkList:  ' +          checkList}}
            <input type="checkbox" v-model="checkList" value="vue"/> vue
            <input type="checkbox" v-model="checkList" value="react"/> react
            <input type="checkbox" v-model="checkList" value="wx"/> 小程序
        </div>

        <div>
            <h2>性别选择</h2>
            {{ 'select:   '  +   select}}
            <input type="radio" v-model="select" value="a" />男
            <input type="radio" v-model="select" value="b" />女
        </div>
    </div>
     
    <script>
       var vm = new Vue({
            el: '#box',
            data() {
                return {
                    mytext: localStorage.getItem('username'),
                    isRemember: true,
                    checkList: [],
                    select: 'a'
                }
            },
            methods: {
                handleLogin() {
                    if(this.isRemember) localStorage.setItem('username', this.mytext)
                }
            }
        })

        // vue架构模式   mvvm（双向数据绑定）
    </script>
</body>
</html>
