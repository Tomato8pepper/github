<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .po{
            color: red;
        }
        .active{
            color: green;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="./node_modules/vue/dist/vue.js"></script>
    <script>
        // 单向数据流：从model到view的过程
        new Vue({
            el: '#app',
            template: `
                <div>
                    <p class='po' :class='{ active: isRed }'>bind绑定</p> 
                    <button @click='isRed=!isRed'>切换字体的颜色</button>
                </div>
            `,
            data: function() {
                return {
                    isRed: false
                }
            }
        })
    </script>
</body>
</html>
