<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app"></div>
    <script src="./node_modules/vue/dist/vue.js"></script>
    <script>
        Vue.filter('myReverse', function (value, args) {
            return args +' ' + value.split('').reverse().join('')
        })
         
        // 局部组件
        var App = {
            template: `
                <div>
                     <input type='number' v-model='price' />
                     <h2>{{price | myCurrentcy}}</h2>
                     <h3>{{msg | myReverse('haha') }}
                </div>
            `,
            data() {
                return {
                    price: 0,
                    msg: 'hello_filter'
                }
            },
            filters: {
                myCurrentcy(value) {
                    return '$' + value
                }
            }
        }

        new Vue({
            el: '#app',
            template: `<App></App>`,
            data: function() {
                return {}
            },
            components: {
                App
            }
        })
    </script>
</body>
</html>
