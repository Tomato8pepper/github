<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- 1.引包 -->
    <script src="./node_modules/vue/vue.js"></script>
    
    <div id="app">
        <h3>{{msg}}</h3>
        <h4>{{ {name: 'tom'} }}</h4>
        <!-- 字符串
             判断后的布尔值
             三元表达式
             -->
    </div>

    <!-- 2.创建实例化vue对象 -->
    <!-- 插值模板语法 {{}} -->
    <script>
        new Vue({
            el: '#app',
            // 如果有template优先编译、渲染它
            // template: '<div>{{temp}}</div>',
            // 返回一个对象，在组件中是一个函数，保存了一些数据属性
            data: function() {
                return {
                    msg: 'study vue',
                    temp: 'temp'
                }
            }
        })

        //  设计思想：MVVM         Model(数据属性)  View(模板)  ViewModel(插值模板语法, 指令系统，事件等)
    </script>
     
</body>
</html>
