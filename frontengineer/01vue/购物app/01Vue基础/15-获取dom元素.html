<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <App></App>
    </div>
    <script src="./node_modules/vue/dist/vue.js"></script>
    <script>
        // 局部组件
        var subComponent = {
            template: `
                <div></div>
            `
        }
        Vue.component('subCom', subComponent)

        var App = {
            template: `
                <div class='app'>
                    <button ref='btn'>我是按钮</button>
                    <button ref='btn2'>我是按钮2</button>
                    <subCom ref='sub'>我是组件</subCom>
                </div>
            `,
            data() {
                return {
                    
                }
            },
            created() {
                console.log(this.$refs.btn)
            },
            beforeMount() {
                console.log(this.$refs.btn)
            },
            mounted() {
                // 如果是给标签绑定ref，那么获取的是原生的jsdom对象
                // 如果是给组件绑定的ref，那么获取的是组件对象
                console.log(this.$refs.btn)
                console.log(this.$refs.btn2)
                console.log(this.$refs.sub)
            }
        }

        
        new Vue({
            el: '#app',
            data: function() {
                return {
                    
                }
            },
            components: {
                App
            }
        })
    </script>
</body>
</html>
