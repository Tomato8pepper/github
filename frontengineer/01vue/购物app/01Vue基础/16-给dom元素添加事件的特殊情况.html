<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
    </div>
    <script src="./node_modules/vue/dist/vue.js"></script>
    <script>
        // 局部组件
        var App = {
            template: `
                <div class='app'>
                    <input v-if='isShow' ref='input' />
                </div>
            `,
            data() {
                return {
                    isShow: false
                }
            },
            mounted() {
                this.isShow = true

                // 无效
                // this.$refs.input.focus() 

                // $nextTick是在dom更新循环结束之后执行的延迟回调，在修改数据之后调用$nextTick可以在回调中获取到更新后的dom
                this.$nextTick(() => {
                    this.$refs.input.focus()
                })
            }
        }

        
        new Vue({
            el: '#app',
            template: `
                <App />
            `,
            data: function() {
                return {
                    
                }
            },
            components: {
                App
            }
        })
    </script>
</body>
</html>
