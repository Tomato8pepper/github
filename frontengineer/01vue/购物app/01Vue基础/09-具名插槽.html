<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app"></div>
    <script src="./node_modules/vue/dist/vue.js"></script>
    <script>
        Vue.component('mySlot', {
            template: `
                <div>
                    <slot name="one"></slot>    
                    <slot name="two"></slot>
                </div>
            `
        })

        // 局部组件
        var App = {
            template: `
                <div>
                    <ul>
                        <mySlot>
                            <h2 slot='two'>张三</h2>    
                            <h3 slot='one'>李四</h3>
                        </mySlot>   
                    </ul>
                </div>
            `,
            data() {
                return {
                }
            }
        }

        new Vue({
            el: '#app',
            template: `<App></App>`,
            data: function() {
                return {}
            },
            components: {
                App
            }
        })
    </script>
</body>
</html>
