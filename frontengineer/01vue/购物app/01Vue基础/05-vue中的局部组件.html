<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app"></div>
    <script src="./node_modules/vue/dist/vue.js"></script>
    <script>
        var Vheader = {
            template: `<div class='head'>我是头部组件</div>`
        }

        var Vaside = {
            template: `<div class='aside'>我是侧边栏组件</div>`
        }

        // 局部组件
        var App = {
            template: `
                <div>
                    <Vheader/>
                    <h3>我是局部组件</h3>
                    <Vaside/>
                </div>
            `,
            data() {
                return {}
            },
            components: {
                Vheader,
                Vaside
            }
        }

        new Vue({
            el: '#app',
            template: `<App></App>`,
            data: function() {
                return {}
            },
            components: {
                App
            }
        })
    </script>
</body>
</html>
