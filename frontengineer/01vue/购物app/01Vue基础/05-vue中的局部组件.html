<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .head{
        width: 100%;
        height: 80px;
        background-color: purple;
    }
    .main2{
        width: 100%;
        height: 1000px;
    }
    .main2 .aside{
        float: left;
        width: 30%;
        height: 100%;
        background-color: green;
    }
    .main2 .content{
        height: 100%;
        background-color: yellow;
    }
</style>
<body>
    <div id="app"></div>
    <script src="./node_modules/vue/dist/vue.js"></script>
    <script>
        // 全局组件
        Vue.component('Vbtn', {
            template: `
                <button>按钮</button>
            `
        })


        var Vheader = {
            template: `<div class='head'>我是头部组件
                            <Vbtn />
                        </div>`
        }

        var Vaside = {
            template: `<div class='aside'>我是侧边栏组件
                            <Vbtn />
                        </div>`
        }

        var Vcontent = {
            template: `<div class='content'>我是内容组件
                            <Vbtn />
                        </div>`
        }

        // 局部组件
        var App = {
            template: `
                <div class='main'>
                    <Vheader/>
                    <div class='main2'>
                        <Vaside />
                        <Vcontent />
                    </div>
                </div>
            `,
            data() {
                return {}
            },
            components: {
                Vheader,
                Vaside,
                Vcontent
            }
        }

        new Vue({
            el: '#app',
            template: `<App></App>`,
            data: function() {
                return {}
            },
            components: {
                App
            }
        })
    </script>
</body>
</html>
