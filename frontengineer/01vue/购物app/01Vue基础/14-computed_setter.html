<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;
        }
        ul li{
            margin: 20px 20px;
            padding: 10px 5px;
            border-radius: 3px;
        }
        .active{
            background-color: #66ffff;
        }
    </style>
</head>
<body>
    <div id="app">
        <audio :src='getCurrentSongSrc' autoplay controls></audio>
        <ul>
            <li v-for="(item, index) in musicData" :key="item.id" :class="{active: currentIndex===index}" @click="handleClick(index)">
                <h2>{{item.id}} - 歌名: {{item.name}}</h2>
                <h4>歌手：{{item.author}}</h4>
            </li>
        </ul>
         
    </div>
    <script src="./node_modules/vue/dist/vue.js"></script>
    <script>
        var musicData = [
            { id: 1, name: '于荣光 - 少林英雄', author: '于荣光', songSrc: './static/于荣光 - 少林英雄.mp3' },
            { id: 2, name: 'Joel Adams - please Dont Go.mp3', author: 'Joel Adams', songSrc: './static/Joel Adams - please Dont Go.mp3' },
            { id: 3, name: 'MKJ - Time.mp3', author: 'MKJ', songSrc: './static/MKJ - Time.mp3' },
            { id: 4, name: 'Russ - Psycho (Pt. 2).mp3', author: 'Russ', songSrc: './static/Russ - Psycho (Pt. 2).mp3' }
        
        ]
        new Vue({
            el: '#app',
            // template: `<div></div>`,
            data: function() {
                return {
                    musicData: musicData,
                    currentIndex: 0
                }
            },
            computed: {
                // getCurrentSongSrc() {
                //     return this.musicData[this.currentIndex].songSrc
                // }
                
                getCurrentSongSrc: {
                    set(newV) {
                        this.currentIndex = newV
                    },
                    get() {
                        return this.musicData[this.currentIndex].songSrc
                    }
                }
            },
            methods: {
                handleClick(idx) {
                    // this.currentIndex = idx

                    this.getCurrentSongSrc = idx
                }
            }
        })
    </script>
</body>
</html>
