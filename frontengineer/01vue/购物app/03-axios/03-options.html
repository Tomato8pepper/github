<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <!-- 1. 先引入vue.js -->
    <script src="./node_modules/vue/dist/vue.min.js"></script>
    <script src="./node_modules/axios/dist/axios.js"></script>
<body>
    <div id="app">
         
    </div>  
    <script>
        Vue.prototype.$axios = axios

         var App = {
            template: `
                <div>
                     <button @click='sendAjax'>发请求</button>
                </div>
            `,
            methods: {
                sendAjax() {
                    this.$axios.defaults.baseURL = 'http://127.0.0.1:8888'
                    this.$axios.get('', 
                    { 
                        params: { id: 1 }, 
                        // 在传递给then, catch之前修改数据
                        transformResponse: [
                            function (data) {
                                console.log(typeof data)
                                data = JSON.parse(data)
                                return data
                            }
                        ]
                    })
                    .then(res => {
                        console.log(res)
                    })
                    .catch(err => {
                        console.log(err)
                    })

                    this.$axios.post('/add', 'name=jack', {
                        // 传递给后端的时候允许修改数据
                        transformRequest: [
                            function (data) {
                                console.log(data)
                                data='name=rose'
                                return data
                            }
                        ]
                    })
                }
            }
         }

         new Vue({
            el: '#app',
            template: '<App />',
            components: {
                App
            },
            
         })
    </script>


</body>
</html>
