<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <div id="app"></div>
     <!-- 1. 先引入vue.js -->
     <script src="./node_modules/vue/dist/vue.min.js"></script>
     <!-- 2. 引入核心插件vue-router -->
     <script src="./node_modules/vue-router/dist/vue-router.js"></script>

     <script>

        // 地址栏 路由范式
        // 1. xx.html#/user/1   params动态路由参数
        // 2. xx.html#/user?userId=1   query

         
        var comDesc = {
            template: `
                <div>
                    {{msg}}
                </div>
            `,
            data() {
                return {
                    msg: ''
                }
            },
            created() {
                this.msg = '安卓'
            },
            watch: {
                '$route'(to, from) {
                    this.msg = to.params.id
                }
            }
        }

        
        var Timeline = {
            template: `
                <div>
                     
                    
                    <router-link :to='{ name: "comDesc", params:{id: "andorid"}}'>安卓</rotuer-link>     
                    <router-link :to='{ name: "comDesc", params:{id: "frontend"}}'>前端</rotuer-link>    

                    <router-view />

                </div>
            `
        }

        var Pins = {
            template: `
                <div></div>
            `
        }

        // 2.1 让Vue使用vue-router，如果Vue是一个局部作用域的对象，那么必须Vue.use(VueRouter)
        Vue.use(VueRouter)

        // 2.2 创建路由对象
        var router = new VueRouter({
            // 2.3 配置路由对象
            routes: [
                // 2.4 路由匹配的规则
                {
                    path: '/timeline',
                    name: 'timeline',
                    component: Timeline,
                    children: [
                        {
                            path: '/timeline/:id',
                            name: 'comDesc',
                            component: comDesc
                        } 
                    ]
                },
                {
                    path: '/pins',
                    name: 'pins',
                    component: Pins 
                } 
            ]
        })


         
        var App = {
            template: `
                <div>
                    
                    <router-link :to='{ name: "timeline"}'>首页</rotuer-link>     
                    <router-link :to='{ name: "pins"}'>沸点</rotuer-link>    
                    
                    <router-view />
                </div>
            `
        }

        // 2.5 将配置好的路由对象关联到vue实例化对象中
        new Vue({
            el: '#app',
            router: router,
            template: '<App />',
            components: {
                App
            }
        })
     </script>
</body>
</html>
