<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <div id="app"></div>
     <!-- 1. 先引入vue.js -->
     <script src="./node_modules/vue/dist/vue.min.js"></script>
     <!-- 2. 引入核心插件vue-router -->
     <script src="./node_modules/vue-router/dist/vue-router.js"></script>

     <script>

        // 地址栏 路由范式
        // 1. xx.html#/user/1   params动态路由参数
        // 2. xx.html#/user?userId=1   query

        var UserParams = {
            template: `
                <div>我是用户1</div>
            `,
            created() {
                console.log(this.$router)
                console.log(this.$route)
                
            }
        }

        var UserQuery = {
            template: `
                <div>我是用户2</div>
            `,
            created() {
                console.log(this.$router)
                console.log(this.$route)
            }
        }

        // 2.1 让Vue使用vue-router，如果Vue是一个局部作用域的对象，那么必须Vue.use(VueRouter)
        Vue.use(VueRouter)

        // 2.2 创建路由对象
        var router = new VueRouter({
            // 2.3 配置路由对象
            routes: [
                // 2.4 路由匹配的规则
                {
                    path: '/user/:id',
                    name: 'userP',
                    component: UserParams
                },
                {
                    path: '/user',
                    name: 'userQ',
                    component: UserQuery
                }
            ]
        })

         
        var App = {
            template: `
                <div>
                    <router-link :to='{name: "userP", params: {id: 1}}'>用户1</router-link>
                    <router-link :to='{name: "userQ", query: {userId: 2}}'>用户2</rotuer-link>     

                    
                    <router-view />
                </div>
            `
        }

        // 2.5 将配置好的路由对象关联到vue实例化对象中
        new Vue({
            el: '#app',
            router: router,
            template: '<App />',
            components: {
                App
            }
        })
     </script>
</body>
</html>
