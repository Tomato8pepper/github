<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <div id="app"></div>
     <!-- 1. 先引入vue.js -->
     <script src="./node_modules/vue/dist/vue.min.js"></script>
     <!-- 2. 引入核心插件vue-router -->
     <script src="./node_modules/vue-router/dist/vue-router.js"></script>

     <script>
        console.log(VueRouter)
        var Login = {
            template: `
                <div>我是登录页面</div>
            `
        }

        var Register = {
            template: `
                <div>我是注册页面</div>
            `
        }

        // 2.1 让vue使用vue-router
        Vue.use(VueRouter)

        // 2.2 创建路由对象
        var router = new VueRouter({
            // 配置路由对象
            routes: [
                // 路由匹配的规则
                {
                    path: '/login',
                    component: Login
                },
                {
                    path: '/register',
                    component: Register
                }
            ]
        })

        // 抛出两个全局组件 router-link、 router-view
        // router-view路由组件的出口
        var App = {
            template: `
                <div>
                    <router-link to='/login'>登录</router-link>
                    <router-link to='/register'>注册</rotuer-link>     

                    
                    <router-view />
                </div>
            `
        }

        new Vue({
            el: '#app',
            router: router,
            template: '<App />',
            components: {
                App
            }
        })
     </script>
</body>
</html>
