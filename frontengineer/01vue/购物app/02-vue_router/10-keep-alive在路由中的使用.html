<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <!-- 1. 先引入vue.js -->
    <script src="./node_modules/vue/dist/vue.min.js"></script>
    <!-- 2. 引入核心插件vue-router -->
    <script src="./node_modules/vue-router/dist/vue-router.js"></script>
<body>


    <div id="app">
         
    </div>

    
    <script>
        Vue.use(VueRouter)

        var Series = {
            template: `
                <div>
                     付费栏目 
                </div>
            `,
            created() {
                console.log('付费栏目created')
                
            },
            mounted() {
                console.log('付费栏目mounted')
            },
            destroyed() {
                console.log('付费栏目destroyed')
            }
        }

        var Topics = {
            template: `
                <div>
                     <h3 @click='clickHandler'>专题广场</h3> 
                </div>
            `,
            methods: {
                clickHandler(e) {
                    e.target.style.color = 'red'
                }
            },
            created() {
                console.log('专题广场creaetd')
            },
            mounted() {
                console.log('专题广场mounted')
            },
            destroyed() {
                console.log('专题广场destroyed')
            }
        }

        var router = new VueRouter({
            routes: [
                {
                    path: '/series',
                    component: Series
                },
                {
                    path: '/topics',
                    component: Topics
                }
            ]
        })


         var App = {
            template: `
                <div>
                    <router-link to='/series'>付费栏目</router-link>    
                    <router-link to='/topics'>专题广场</router-link>   

                    <keep-alive>
                        <router-view />
                    </keep-alive>
                    
                </div>
            `
         }

         new Vue({
            el: '#app',
            template: '<App />',
            components: {
                App
            },
            router
         })
    </script>


</body>
</html>
