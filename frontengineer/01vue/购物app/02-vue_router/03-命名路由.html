<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <div id="app"></div>
     <!-- 1. 先引入vue.js -->
     <script src="./node_modules/vue/dist/vue.min.js"></script>
     <!-- 2. 引入核心插件vue-router -->
     <script src="./node_modules/vue-router/dist/vue-router.js"></script>

     <script>

        var Login = {
            template: `
                <div>我是登录页面</div>
            `
        }

        var Register = {
            template: `
                <div>我是注册页面</div>
            `
        }

        // 2.1 让Vue使用vue-router，如果Vue是一个局部作用域的对象，那么必须Vue.use(VueRouter)
        Vue.use(VueRouter)

        // 2.2 创建路由对象
        var router = new VueRouter({
            // 2.3 配置路由对象
            routes: [
                // 2.4 路由匹配的规则
                {
                    path: '/login',
                    name: 'login',
                    component: Login
                },
                {
                    path: '/register',
                    name: 'register',
                    component: Register
                }
            ]
        })

        // 抛出两个全局组件 router-link、 router-view, 以及两个路由对象$router路由操作、$route路由信息挂载到了Vue实例化对象上
        // router-view路由组件的出口
        var App = {
            // router-link默认会被渲染成a标签，to默认会被渲染成href属性
            template: `
                <div>
                    <router-link :to='{name: "login"}'>登录</router-link>
                    <router-link :to='{name: "register"}'>注册</rotuer-link>     

                    
                    <router-view />
                </div>
            `
        }

        // 2.5 将配置好的路由对象关联到vue实例化对象中
        new Vue({
            el: '#app',
            router: router,
            template: '<App />',
            components: {
                App
            }
        })
     </script>
</body>
</html>
